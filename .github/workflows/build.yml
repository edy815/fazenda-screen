name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Build structure
        run: |
          mkdir -p app/src/main/java/com/fazenda50/screen
          mkdir -p app/src/main/res/xml
          mv MainActivity.kt app/src/main/java/com/fazenda50/screen/ 2>/dev/null || cp MainActivity.kt app/src/main/java/com/fazenda50/screen/
          mv ScreenService.kt app/src/main/java/com/fazenda50/screen/ 2>/dev/null || cp ScreenService.kt app/src/main/java/com/fazenda50/screen/
          mv ClickService.kt app/src/main/java/com/fazenda50/screen/ 2>/dev/null || cp ClickService.kt app/src/main/java/com/fazenda50/screen/
          cat > app/src/main/AndroidManifest.xml << 'MANI'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.fazenda50.screen">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
            <application android:label="Fazenda-50">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <service android:name=".ScreenService" android:foregroundServiceType="mediaProjection"/>
              <service android:name=".ClickService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility"/>
              </service>
            </application>
          </manifest>
          MANI
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:canPerformGestures="true"/>' > app/src/main/res/xml/accessibility.xml
          cat > settings.gradle << 'SET'
          include ':app'
          SET
          cat > build.gradle << 'B1'
          plugins { id 'com.android.application' version '8.1.0' apply false }
          B1
          cat > app/build.gradle << 'B2'
          plugins { id 'com.android.application' }
          android { namespace 'com.fazenda50.screen'; compileSdk 34; defaultConfig { applicationId "com.fazenda50.screen"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }; buildTypes { release { minifyEnabled false } } }
          dependencies { implementation 'org.java-websocket:Java-WebSocket:1.5.3'; implementation 'org.slf4j:slf4j-api:1.7.36' }
          B2
      - name: Build APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fazenda-50-APK
          path: app/build/outputs/apk/debug/*.apk
